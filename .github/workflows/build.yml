name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Tools
        run: apt-get update && apt-get install -y --no-install-recommends zip

      - uses: actions/checkout@v4

      - name: Build PadLink
        run: make -j"$(nproc)"

      - name: Package (unzip to the root of your SD card)
        run: |
          mkdir -p dist/sd/switch/padlink
          cp padlink.nro dist/sd/switch/padlink/
          (cd dist/sd && zip -r ../PadLink-sd.zip switch)
          mkdir -p dist/pc/PadLink-PC
          cp pc/*.py pc/README.md dist/pc/PadLink-PC/ 2>/dev/null || cp pc/*.py dist/pc/PadLink-PC/
          (cd dist/pc && zip -r ../PadLink-PC-receiver.zip PadLink-PC)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PadLink
          path: |
            dist/PadLink-sd.zip
            dist/PadLink-PC-receiver.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PadLink-sd.zip
            dist/PadLink-PC-receiver.zip
          generate_release_notes: true
